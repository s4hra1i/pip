name: tests
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Ifirmware/src/core firmware/src/core/pet.cpp test/test_pet.cpp -o test_pet
          ./test_pet
